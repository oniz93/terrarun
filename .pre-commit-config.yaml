repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l
        language: system
        files: \.go$
        args: [-w]

      - id: goimports
        name: goimports
        entry: goimports
        language: system
        files: \.go$
        args: [-w]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        files: \.go$
        types: [go]

      - id: flutter-format
        name: flutter-format
        entry: flutter format
        language: system
        files: \.dart$
