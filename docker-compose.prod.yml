services:
  postgres:
    image: timescale/timescaledb-ha:pg16-latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: terrarun
      POSTGRES_USER: terrarun
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrarun"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ROOT: /data
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://terrarun:${DB_PASSWORD}@postgres:5432/terrarun?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: terrarun
      STORAGE_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      BCRYPT_COST: "12"
      PHONE_HASH_PEPPER: ${PHONE_HASH_PEPPER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      FIREBASE_CREDS_FILE: ""
      LOOP_CLOSURE_RADIUS_M: "100"
      PATH_CAPTURE_ENABLED: "true"
      PATH_CAPTURE_BUFFER_M: "25"
      HEX_HP_CAP: "10"
      HEX_HP_DECAY: "1"
      TERRITORY_BASE_POINTS: "10"
      TERRITORY_STEAL_BONUS_PCT: "0.5"
      RUNNER_POINT_PER_100M: "1.0"
      RUNNER_POINT_PER_10M_ELEV: "5.0"
      TERRITORY_POINT_SHARE_PCT: "0.1"
      SOCIAL_BASE_MULTIPLIER: "0.25"
      SOCIAL_EXTRA_PER_FRIEND: "0.10"
      SOCIAL_MULTIPLIER_CAP: "0.50"
      XP_CONVERSION_RATIO: "1.0"
      MAX_SEGMENT_SPEED_KMH: "35"
      MAX_AVG_SPEED_KMH: "20"
      MIN_DISTANCE_FOR_AVG_CHECK_M: "2000"
      MAX_GPS_JUMP_M: "500"
      FLAG_AVG_SPEED_KMH: "15"
      FLAG_DISTANCE_M: "50000"
      FLAG_LOW_ACCURACY_M: "20"
      FLAG_LOW_ACCURACY_RATIO: "0.3"
      MAX_DB_CONNS: "25"
      MIN_DB_CONNS: "5"
      RATE_LIMIT_AUTH_REGISTER: "5"
      RATE_LIMIT_AUTH_LOGIN: "20"
      RATE_LIMIT_AUTH_REFRESH: "10"
      RATE_LIMIT_RUNS_START: "10"
      RATE_LIMIT_RUNS_END: "10"
      RATE_LIMIT_TERRITORY: "30"
      RATE_LIMIT_FRIENDS_ADD: "20"
      BOTS_PER_FACTION: "10"
      BOT_SEEDING_RADIUS_KM: "100"
      BOT_ACTIVE_RADIUS_KM: "10"
      BOT_DEFAULT_DISTANCE_M: "5000"
      BOT_CITY_SPAWN_INTERVAL_S: "30"
      BOT_MAX_PER_HEX: "2"
      BOT_PHASE_OUT_THRESHOLD: "20"
      BOT_SEEDING_MAX_CLAIMED: "0.60"
      SEASON_DURATION_DAYS: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - internal

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./migrate", "up"]
    environment:
      DATABASE_URL: postgres://terrarun:${DB_PASSWORD}@postgres:5432/terrarun?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - api
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
  redis_data:
  rustfs_data:
  certbot_www:
  certbot_conf:

networks:
  internal:
    driver: bridge
